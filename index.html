<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dj make clean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Tone.js for audio generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

        /* Define a CSS variable for the custom font */
        :root {
             --my-font: 'Libre Baskerville', cursive;
        }

        /* Base styling for the body */
        body {
            font-family: var(--my-font);
            background-color: #001100; /* Dark blue-gray background */
            color: #e2e8f0; /* Light text color */
            margin: 0;
            display: flex;
            flex-direction: column; /* Allow stacking header and content */
            justify-content: flex-start; /* Align content to the top */
            align-items: center;
            min-height: 100vh; /* Ensure body takes full viewport height */
            overflow: hidden; /* Prevent scrollbars */
            cursor: none; /* Hide the default mouse cursor */
            position: relative; /* Needed for positioning all canvases */
        }

        /* Background Lattice Canvas */
        #background-lattice-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Lowest z-index to be truly in the background */
            pointer-events: none; /* Allows clicks to pass through to elements below */
        }

        /* Header Styling */
        .main-header {
            margin-top: 5vh; /* Space from the top */
            margin-bottom: 1rem; /* Reduced space before new text */
            text-align: center;
            color: white;
            font-size: 4rem; /* Large font size for blockiness */
            letter-spacing: 2px; /* Add some spacing between letters */
            text-transform: lowercase; /* Ensure lowercase styling */
            /* Pixelation effect using multiple text shadows */
            text-shadow:
                1px 1px 0px white,
                2px 2px 0px white,
                3px 3px 0px white,
                4px 4px 0px #00FFFF,
                5px 5px 0px #00FFFF,
                0 0 15px rgba(0, 255, 255, 0.7), /* Outer glow */
                0 0 30px rgba(0, 255, 255, 0.5);
            animation: header-flicker 2s infinite alternate; /* Subtle flicker */
            position: relative; /* Ensure it's above other elements */
            z-index: 11;
            font-family: 'Times New Roman', serif; /* Keep original font for the title */
        }

        @keyframes header-flicker {
            0%, 100% { opacity: 1; text-shadow: 1px 1px 0px #00FFFF, 2px 2px 0px #00FFFF, 3px 3px 0px #00FFFF, 4px 4px 0px #00FFFF, 5px 5px 0px #00FFFF, 0 0 15px rgba(0, 255, 255, 0.7), 0 0 30px rgba(0, 255, 255, 0.5); }
            50% { opacity: 0.9; text-shadow: 1px 1px 0px #00FFFF, 2px 2px 0px #00FFFF, 3px 3px 0px #00FFFF, 0 0 10px rgba(0, 255, 255, 0.5); }
        }


        /* Custom Cursor Styling */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            /* Border sizes will be set by JS */
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #00FFFF; /* Default Bright Cyan for the main face, overridden by JS */
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.9)); /* Stronger glow, overridden by JS */
            pointer-events: none; /* Allows clicks to pass through */
            z-index: 9999; /* Ensures the cursor is on top */
            transform: translate(-50%, -50%); /* Centers the base point of the pyramid */
            transition: transform 0.05s ease-out; /* Smooth movement */

            /* Blinking animation */
            animation: cursor-blink 1.0s infinite alternate; /* Faster blink */
        }

        @keyframes cursor-blink {
            0%, 20%, 80%, 100% { opacity: 1; }
            50% { opacity: 0.4; } /* More transparent when blinking */
        }

        /* Canvas for Ripples */
        #ripple-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows interaction with elements below */
            z-index: 5; /* Below the content, above the body background */
        }

        /* Canvas for Left CD */
        #cd-canvas-left {
            position: absolute; /* Changed to absolute for independent movement */
            /* Width and height will be set by JS */
            pointer-events: none; /* Allows interaction with elements below */
            border-radius: 50%; /* Make it circular */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); /* Subtle glow */
            z-index: 11; /* Ensure it's above other elements */
        }

        /* Canvas for Right CD */
        #cd-canvas-right {
            position: absolute; /* Changed to absolute for independent movement */
            /* Width and height will be set by JS */
            pointer-events: none; /* Allows interaction with elements below */
            border-radius: 50%; /* Make it circular */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); /* Subtle glow */
            z-index: 11; /* Ensure it's above other elements */
        }

        /* Adjust body to align content to the top */
        body {
            justify-content: flex-start; /* Align content vertically to the top */
        }

        /* Stop Button Styling (Octagon) */
        #stop-discs-button {
            position: fixed;
            /* top, right, width, height, padding, and font-size will be set by JS */
            background-color: #346beb; /* freeze color */
            color: white;
            font-family: 'Press Start 2P', cursive; /* Pixelated font */
            border: none; /* Removed default border */
            border-radius: 5px; /* Slight roundness */
            cursor: pointer;
            z-index: 1000; /* Ensure it's on top */
            /* Octagon shape using clip-path */
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            transition: transform 0.1s ease, opacity 0.3s ease; /* Keep transform/opacity transition */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow:
                0 0 0 2px white, /* White outline */
                0 0 0 3px black; /* Thin black outline outside white */
            text-transform: uppercase; /* Ensure text is uppercase */
            display: flex; /* Use flex to center text vertically */
            flex-direction: column; /* Stack text lines */
            align-items: center;
            justify-content: center;
            line-height: 1.2; /* Adjust line height for multi-line text */
            text-align: center; /* Center text horizontally */
            white-space: normal; /* Allow text to wrap naturally within the button */
            animation: flash-button 1s infinite steps(1); /* Flashing animation */
        }

        #stop-discs-button:hover:not(:disabled) {
            background-color: #346beb; /* freeze color */
            transform: scale(1.05);
        }

        #stop-discs-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #888888; /* Grey out when disabled */
            box-shadow:
                0 0 0 2px #cccccc, /* Greyed out white outline */
                0 0 0 3px #555555; /* Greyed out black outline */
            animation: none; /* Stop flashing when disabled */
        }

        @keyframes flash-button {
            0% { background-color: #346beb; } /* Freeze Blue */
            50% { background-color: #000000; } /* Black */
            100% { background-color: #346beb; } /* Freeze Blue (loops back) */
        }

        /* Audio Toggle Button Styling */
        #audioToggleBtn {
            position: fixed;
            /* top, right, width, height, font-size and padding will be set by JS */
            background-color: #34d399; /* Green */
            color: white;
            font-family: 'Press Start 2P', cursive;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 0 0 2px white, 0 0 0 3px black;
            text-transform: uppercase;
            transition: background-color 0.1s ease, transform 0.1s ease;
            display: flex; /* Enable flexbox for vertical alignment */
            flex-direction: column; /* Stack text vertically */
            align-items: center;
            justify-content: center;
            line-height: 1.1; /* Adjust line height for stacked text */
            text-align: center; /* Center text horizontally */
        }
        #audioToggleBtn:hover {
            background-color: #28a776; /* Darker green */
            transform: scale(1.05);
        }
        #audioToggleBtn.muted {
            background-color: #888888; /* Grey when muted */
            box-shadow: 0 0 0 2px #cccccc, 0 0 0 3px #555555;
        }

        /* Container for Intro Text and Photo */
        #content-flex-container {
            display: flex;
            flex-direction: column; /* Stack vertically */
            justify-content: center;
            align-items: center;
            gap: 1.5rem; /* Reduced gap between photo and text */
            margin-bottom: 3rem; /* Space below this section */
            max-width: 1200px; /* Max width for this container */
            padding: 0 20px; /* Add some horizontal padding */
            position: relative;
            z-index: 10;
        }

        /* New Text below title */
        .intro-text {
            font-family: var(--my-font);
            font-size: 1.5rem; /* Smaller font size for paragraph */
            color: #e2e8f0;
            text-align: center; /* Changed to center */
            max-width: 700px; /* Increased width for the text */
            flex-shrink: 1; /* Allow text to shrink if needed */


            animation: text-flicker-subtle 3s infinite alternate; /* Slower flicker */

            text-shadow:
                1px 1px 0px rgba(255, 255, 255, 0.1), /* Very subtle white shadow */
                2px 2px 0px rgba(255, 255, 255, 0.08),
                3px 3px 0px rgba(255, 255, 255, 0.06),
                4px 4px 0px rgba(0, 255, 255, 0.04), /* Very subtle cyan shadow */
                5px 5px 0px rgba(0, 255, 255, 0.02),
                0 0 5px rgba(0, 255, 255, 0.1), /* Subtle outer glow */
                0 0 10px rgba(0, 255, 255, 0.05);
        }

        @keyframes text-flicker-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; } /* Less transparency when flickering */
        }

        /* User Photo Placeholder */
        #user-photo-placeholder {
            /* Width and height will be set by JS */
            background-color: #333; /* Dark grey placeholder */
            border: 2px dashed #00FFFF; /* Cyan dashed border */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            border-radius: 8px;
            overflow: hidden; /* Ensure text doesn't overflow */
            flex-shrink: 0; /* Prevent photo from shrinking too much */
        }

        #user-photo-placeholder .album-art {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Changed to contain to prevent cropping */
        }

        #user-photo-placeholder .placeholder-text {
            font-family: var(--my-font);
            color: #00FFFF;
            font-size: 1rem; /* Adjusted font size for smaller box */
            text-align: center;
            padding: 5px;
            line-height: 1.2;
        }


        /* New Link Boxes Container */
        .link-boxes-container {
            position: relative; /* Positioning context for absolute children */
            width: 80%; /* Responsive width */
            /* max-width and height will be set by JS */
            pointer-events: none; /* Allow clicks to pass through to individual boxes */
            z-index: 10; /* Ensure it's above canvases */
            margin-bottom: 50px; /* Space at the bottom */
        }

        .link-box {
            background-color: rgba(0, 0, 0, 0.3); /* Semi-transparent background */
            border-radius: 8px; /* Rounded corners */
            border: 2px solid white; /* Thick white outline */
            /* Padding will be set by JS for responsiveness */
            display: flex;
            flex-direction: column;
            align-items: center; /* Center content horizontally */
            justify-content: center; /* Center content vertically */
            text-align: center; /* Center text */
            cursor: pointer;
            box-shadow: none; /* No inner glow */
            pointer-events: auto; /* Re-enable pointer events for interaction */

            position: absolute; /* Now absolutely positioned within its container */
            overflow: hidden; /* Hide overflowing content */
        }

        /* Specific dimensions for each box (all divided by 2 again) */
        #box-latest {
            /* Width, height, and padding will be set by JS */
            justify-content: space-between; /* Distribute space between title, art, links */
            gap: 6px; /* Gap between flex items */
        }

        #box-latest .album-art {
            /* Width and height will be set by JS */
            background-color: #555; /* Darker grey for album art */
            border-radius: 4px; /* Slightly rounded corners for image */
            object-fit: contain; /* Ensure image is never cut off */
        }

        #box-latest .links-group {
            display: flex;
            flex-direction: column; /* Stack links vertically */
            gap: 5px; /* Space between links */
            /* font-size will be set by JS */
        }

        #box-links {
            /* Width, height, and padding will be set by JS */
            /* Justify-content and align-items are set on .link-box */
        }

        #box-links p {
            margin-bottom: 8px; /* Reduced space between lines of text */
            text-align: center; /* Center text */
            width: 100%; /* Take full width */
        }

        #box-contact {
            /* Width, height, and padding will be set by JS */
            text-decoration: none; /* Remove underline by default for the box itself */
            /* Justify-content and align-items are set on .link-box */
        }

        #box-song-request {
            /* Width and height will be set by JS */
            text-decoration: none; /* Remove underline by default for the box itself */
            border-color: #00FFFF; /* Initial cyan border */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); /* Initial cyan glow */
            animation: glowing-border 2s infinite alternate; /* Glowing animation */
            position: fixed; /* Fixed position for this specific box */
            pointer-events: auto; /* Re-enable pointer events */
            z-index: 1000; /* Ensure it's on top */
        }

        /* Special glowing border animation for Box 4 */
        @keyframes glowing-border {
            0% {
                border-color: #008888; /* Darker Cyan */
                box-shadow: 0 0 10px rgba(0, 136, 136, 0.5), 0 0 20px rgba(0, 136, 136, 0.3);
            }
            50% {
                border-color: #000088; /* Darker Blue */
                box-shadow: 0 0 15px rgba(0, 0, 136, 0.7), 0 0 30px rgba(0, 0, 136, 0.5);
            }
            100% {
                border-color: #008888;
                box-shadow: 0 0 10px rgba(0, 136, 136, 0.5), 0 0 20px rgba(0, 136, 136, 0.3);
            }
        }


        /* Remove the ::before pseudo-element for outline as it's now direct on .link-box */
        .link-box::before {
            content: none; /* Explicitly remove content */
        }

        /* Remove all hover effects for link-box, except for the special box which has its own animation */
        .link-box:hover:not(.special-box),
        .link-box:nth-child(1):hover:not(.special-box),
        .link-box:nth-child(2):hover:not(.special-box),
        .link-box:nth-child(3):hover:not(.special-box),
        .link-box:nth-child(4):hover:not(.special-box),
        .link-box:hover::before:not(.special-box), /* Ensure pseudo-element hover is also removed */
        .link-box:nth-child(1):hover::before:not(.special-box),
        .link-box:nth-child(2):hover::before:not(.special-box),
        .link-box:nth-child(3):hover::before:not(.special-box),
        .link-box:nth-child(4):hover::before:not(.special-box) {
            transform: none; /* Ensure no scaling */
            box-shadow: none; /* Ensure no glow */
            /* No clip-path needed for hover either */
        }


        .link-title {
            font-family: var(--my-font); /* Changed to use CSS variable */
            /* font-size will be set by JS */
            color: #FFFFFF; /* Changed to white for better contrast on grey */
            margin-bottom: 6px; /* Reduced margin */
            text-shadow: 1px 1px 0px #00FFFF; /* Kept cyan shadow for a pop */
        }

        /* Styling for text links within boxes */
        .text-link {
            color: #00FFFF; /* Cyan for links */
            text-decoration: none; /* No underline by default */
            font-family: var(--my-font); /* Changed to use CSS variable */
            /* font-size will be set by JS */
            transition: text-decoration 0.1s ease;
        }

        .text-link:hover {
            text-decoration: underline; /* Underline on hover */
        }

        /* Add hover underline for Contact Me and Let Me Make You A Song */
        #box-contact:hover .link-title,
        #box-song-request:hover .link-title {
            text-decoration: underline;
        }

        /* Floating Arrow Styling (CSS Triangle) */
        .floating-arrow {
            position: fixed; /* Fixed position relative to viewport */
            width: 0;
            height: 0;
            /* Border sizes will be set by JS */
            border-left: 0; /* Clear previous border-left */
            border-right: 0; /* Clear previous border-right */
            border-bottom: 0; /* Clear previous border-bottom */
            filter: drop-shadow(0 0 10px); /* Glow color will be animated */
            animation: glowing-arrow-color 2s infinite alternate; /* Color animation */
            pointer-events: none; /* Allow clicks to pass through */
            z-index: 1000;
        }

        /* New animation for arrow color to match glowing-border */
        @keyframes glowing-arrow-color {
            0% {
                border-top-color: #008888; /* Darker Cyan */
                filter: drop-shadow(0 0 10px rgba(0, 136, 136, 0.7));
            }
            50% {
                border-top-color: #000088; /* Darker Blue */
                filter: drop-shadow(0 0 10px rgba(0, 0, 136, 0.7));
            }
            100% {
                border-top-color: #008888;
                filter: drop-shadow(0 0 10px rgba(0, 136, 136, 0.7));
            }
        }

        /* Audio Player Box Specific Styling */
        #audio-player-box {
            /* Width and height will be set by JS */
            /* Padding will be set by JS */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Changed to center for vertical alignment */
            align-items: center;
            gap: 5px; /* Space between title and button */
            /* Inherits border, background from .link-box */
            position: fixed; /* Fixed position to allow it to float independently */
            z-index: 10; /* Ensure it's above background elements */
        }

        #audio-player-box .audio-player-button {
            background-color: transparent; /* Make background transparent */
            border: none; /* Remove border */
            box-shadow: none; /* Remove shadow */
            color: white;
            /* padding and font-size will be set by JS */
            border-radius: 5px;
            font-family: var(--my-font);
            cursor: pointer;
            transition: color 0.2s ease; /* Transition color on hover */
            display: flex; /* Use flex to center SVG icon */
            align-items: center;
            justify-content: center;
            padding: 0; /* Remove padding from button itself, let SVG size handle it */
        }

        #audio-player-box .audio-player-button:hover {
            color: #00FFFF; /* Cyan on hover */
            background-color: transparent; /* Keep transparent */
        }

        /* SVG icon styling within buttons */
        #audio-player-box .audio-player-button svg {
            width: 1.5em; /* Relative to font-size */
            height: 1.5em; /* Relative to font-size */
            color: currentColor; /* Inherit color from parent button */
        }


        /* Back Button Styling (for contact.html and songrequest.html) */
        .back-button-container {
            position: fixed;
            top: 2vh;
            left: 2vw;
            z-index: 1000;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .back-arrow {
            width: 0;
            height: 0;
            border-top: 2.5vh solid transparent;
            border-bottom: 2.5vh solid transparent;
            border-right: 4vw solid; /* Left-pointing triangle */
            filter: drop-shadow(0 0 10px);
            animation: glowing-arrow-color 2s infinite alternate; /* Re-use existing animation */
            transition: transform 0.1s ease;
        }

        .back-arrow:hover {
            transform: translateX(-5px); /* Slight movement on hover */
        }

        .back-text {
            font-family: var(--my-font);
            color: #00FFFF;
            font-size: 1.2rem;
            margin-left: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            animation: text-flicker-subtle 2s infinite alternate;
        }

        @keyframes text-flicker-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .page-content {
            margin-top: 15vh; /* Space from top to avoid header/back button */
            max-width: 800px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00FFFF;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            z-index: 10;
        }

        .page-content h2 {
            font-size: 2.5rem;
            color: #0014FF; /* Blue for headings */
            text-shadow: 0 0 15px rgba(0, 20, 255, 0.3);
            margin-bottom: 1rem;
        }

        .page-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- Custom Stop Button -->
    <button id="stop-discs-button">FREEZE</button>
    <!-- Audio Toggle Button -->
    <button id="audioToggleBtn">Audio<br>ON</button>

    <!-- Background Lattice Canvas -->
    <canvas id="background-lattice-canvas"></canvas>

    <!-- Header (dj make clean) -->
    <header class="main-header" id="main-header">
        <h1>dj make clean</h1>
    </header>

    <!-- Container for Intro Text and Photo -->
    <div id="content-flex-container">
        <!-- Placeholder for the user's photo -->
        <div id="user-photo-placeholder">
            <img src="assets/me.png" alt="Your Photo" class="album-art"/>
        </div>

        <!-- New Text below title -->
        <p class="intro-text">

            Creating things digitally. Sunnyvale CA
            <br></br>
            re: breaks, bass, hyperpop, techno. ...

        </p>
    </div>

    <!-- Canvas for Left CD -->
    <canvas id="cd-canvas-left"></canvas>

    <!-- Canvas for Right CD -->
    <canvas id="cd-canvas-right"></canvas>

    <!-- New Audio Player Box (moved outside link-boxes-container) -->
    <div id="audio-player-box" class="audio-player-box link-box" data-interactive-element>
        <span class="link-title" id="audioFileName">???.mp3</span>
        <button id="audioPlayPauseBtn" class="audio-player-button">
            <!-- Play Icon (triangle) -->
            <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <!-- Pause Icon (two bars, hidden by default) -->
            <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 hidden">
                <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
            </svg>
        </button>
    </div>

    <!-- New Link Boxes Container -->
    <div class="link-boxes-container">
        <!-- Box 1: Latest -->
        <div id="box-latest" class="link-box" data-interactive-element>
            <span class="link-title">Latest</span>
            <img src="assets/stickygeckomtape.png" alt="Latest Single Album Art" class="album-art"/>
            <div class="links-group">
                <a href="https://soundcloud.com/djmakeclean" target="_blank" class="text-link">SoundCloud</a>
                <a href="https://djmakeclean.bandcamp.com/" target="_blank" class="text-link">Bandcamp</a>
                <a href="https://open.spotify.com/album/0YlJUeYlLeEKvNuqT9ssbX?si=EDSdsFANTUuRbe5ibHXbVg" target="_blank" class="text-link">Spotify</a>
            </div>
        </div>

        <!-- Box 2: Links -->
        <div id="box-links" class="link-box" data-interactive-element>
            <span class="link-title">🔗</span>
            <p>Music: <a href="https://soundcloud.com/djmakeclean" target="_blank" class="text-link">SoundCloud</a> <a href="https://djmakeclean.bandcamp.com/" target="_blank" class="text-link">Bandcamp</a> <a href="https://open.spotify.com/artist/1WJIUUAF2HCnL1H4QoLG6w?si=lx-vYmVLRQeVLRqcl3WdeQ" target="_blank" class="text-link">Spotify</a></p>
            <p>Gumroad: <a href="https://gumroad.com/your-profile" target="_blank" class="text-link">gumroad</a></p>
            <p>Socials: <a href="https://youtube.com/your-profile" target="_blank" class="text-link">YouTube</a> <a href="https://instagram.com/your-profile" target="_blank" class="text-link">Instagram</a></p>
        </div>

        <!-- Box 3: Contact Me -->
        <a href="contact.html" id="box-contact" class="link-box link-box-full" data-interactive-element>
            <span class="link-title">Contact Me For...</span>

        // --- Ripple Effect Functions (Used on all pages) ---
        class RippleEffect {
            constructor(startX, startY) {
                this.originX = startX;
                this.originY = startY;
                this.radius = 0;
                this.opacity = 1;
                this.lineWidth = CONFIG.RIPPLE_INITIAL_LINE_WIDTH;
            }

            update() {
                this.radius += CONFIG.RIPPLE_SPEED;
                this.opacity -= CONFIG.RIPPLE_FADE_RATE;
                this.lineWidth = Math.max(0.5, this.lineWidth - CONFIG.RIPPLE_LINE_DECAY);
            }

            draw() {
                if (this.opacity <= 0 || !rippleCtx) return;
                rippleCtx.strokeStyle = `rgba(${parseInt(CONFIG.RIPPLE_COLOR.substring(1,3), 16)}, ${parseInt(CONFIG.RIPPLE_COLOR.substring(3,5), 16)}, ${parseInt(CONFIG.RIPPLE_COLOR.substring(5,7), 16)}, ${this.opacity})`;
                rippleCtx.lineWidth = this.lineWidth;
                rippleCtx.beginPath();
                rippleCtx.arc(this.originX, this.originY, this.radius, 0, Math.PI * 2);
                rippleCtx.stroke();
            }
        }

        function resizeRippleCanvas() {

        function emitRipple() {

        // --- CD Canvas Functions (Only for index.html) ---

            window.cdLeftCenterY = cdCanvasLeft.height / 2; // Made global for drawCD

            cdCtxRight.imageSmoothingEnabled = false;

        function drawCD(ctx, centerX, centerY, rotationAngle, currentCdRadius, currentLabelRadius, currentHoleRadius, gradientStops, innerRingStrokeColor, labelAreaFillColor, innerLabelRingStrokeColor, letterFillColor, holeFillColor) {
            if (!ctx) return;
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotationAngle);

            const gradient = ctx.createRadialGradient(0, 0, currentLabelRadius, 0, 0, currentCdRadius);
            gradientStops.forEach(stop => { gradient.addColorStop(stop.offset, stop.color); });
            ctx.beginPath();
            ctx.arc(0, 0, currentCdRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, currentLabelRadius + (currentCdRadius - currentLabelRadius) * 0.1, 0, Math.PI * 2);
            ctx.strokeStyle = innerRingStrokeColor;
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, currentLabelRadius, 0, Math.PI * 2);
            ctx.fillStyle = labelAreaFillColor;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, currentLabelRadius * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = innerLabelRingStrokeColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            const letterSize = currentCdRadius * 0.1 * 4;
            ctx.fillStyle = letterFillColor;
            ctx.font = `${letterSize}px 'Times New Roman', serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const letterDistance = (currentCdRadius + currentLabelRadius) / 2;
            ctx.fillText('d', letterDistance, 0);
            ctx.fillText('j', 0, letterDistance);
            ctx.fillText('m', -letterDistance, 0);
            ctx.fillText('c', 0, -letterDistance);

            ctx.beginPath();
            ctx.arc(0, 0, currentHoleRadius, 0, Math.PI * 2);
            ctx.fillStyle = holeFillColor;
            ctx.fill();
            ctx.restore();
        }

        const leftCDColors = {
            gradientStops: [{offset: 0, color: '#F0F0F0'}, {offset: 0.2, color: '#F0F8FF'}, {offset: 0.5, color: '#F5F5F5'}, {offset: 0.8, color: '#F0F8FF'}, {offset: 1, color: '#F0F0F0'}],
            innerRingStrokeColor: 'rgba(180, 180, 180, 0.4)', labelAreaFillColor: '#C0C0C0', innerLabelRingStrokeColor: '#333333', letterFillColor: '#000000', holeFillColor: '#000000'

        // --- Background Lattice Functions (Used on all pages) ---
        const LATTICE_BASE_GRID_SIZE = 40; // Kept as local constant as it's not in CONFIG
        const LATTICE_MIN_GRID_SIZE = 10;
        const LATTICE_MAX_GRID_SIZE = 100;
        const LATTICE_LINE_COLOR = 'rgba(200, 200, 200, 0.15)';
        const LATTICE_PERTURBATION_RADIUS = 200;
        const LATTICE_PERTURBATION_STRENGTH = 40;

        function resizeLatticeCanvas() {
            if (!backgroundLatticeCanvas) return;
            backgroundLatticeCanvas.width = window.innerWidth;
            backgroundLatticeCanvas.height = window.innerHeight;
            latticeCtx.imageSmoothingEnabled = false;
            latticeNeedsRedraw = true;
        }

        function drawLattice() {
            if (!latticeCtx) return;
            latticeCtx.clearRect(0, 0, backgroundLatticeCanvas.width, backgroundLatticeCanvas.height);
            latticeCtx.strokeStyle = LATTICE_LINE_COLOR;
            latticeCtx.lineWidth = 1;

            const dynamicGridSize = LATTICE_MAX_GRID_SIZE - (mouseX / window.innerWidth) * (LATTICE_MAX_GRID_SIZE - LATTICE_MIN_GRID_SIZE);
            const currentGridSize = Math.max(LATTICE_MIN_GRID_SIZE, Math.min(LATTICE_MAX_GRID_SIZE, dynamicGridSize));

            for (let x = 0; x <= backgroundLatticeCanvas.width; x += currentGridSize) {
                latticeCtx.beginPath();
                for (let y = 0; y <= backgroundLatticeCanvas.height; y += currentGridSize / 2) {
                    const dist = Math.sqrt(Math.pow(x - mouseX, 2) + Math.pow(y - mouseY, 2));
                    let offsetX = 0;
                    let offsetY = 0;
                    if (dist < LATTICE_PERTURBATION_RADIUS) {
                        const influence = 1 - (dist / LATTICE_PERTURBATION_RADIUS);
                        offsetX = ((x - mouseX) / dist) * LATTICE_PERTURBATION_STRENGTH * influence;
                        offsetY = ((y - mouseY) / dist) * LATTICE_PERTURBATION_STRENGTH * influence;
                        if (isNaN(offsetX)) offsetX = 0;
                        if (isNaN(offsetY)) offsetY = 0;
                    }
                    if (y === 0) { latticeCtx.moveTo(x + offsetX, y + offsetY); } else { latticeCtx.lineTo(x + offsetX, y + offsetY); }
                }
                latticeCtx.stroke();
            }

            for (let y = 0; y <= backgroundLatticeCanvas.height; y += currentGridSize) {
                latticeCtx.beginPath();
                for (let x = 0; x <= backgroundLatticeCanvas.width; x += currentGridSize / 2) {
                    const dist = Math.sqrt(Math.pow(x - mouseX, 2) + Math.pow(y - mouseY, 2));
                    let offsetX = 0;
                    let offsetY = 0;
                    if (dist < LATTICE_PERTURBATION_RADIUS) {
                        const influence = 1 - (dist / LATTICE_PERTURBATION_RADIUS);
                        offsetX = ((x - mouseX) / dist) * LATTICE_PERTURBATION_STRENGTH * influence;
                        offsetY = ((y - mouseY) / dist) * LATTICE_PERTURBATION_STRENGTH * influence;
                        if (isNaN(offsetX)) offsetX = 0;
                        if (isNaN(offsetY)) offsetY = 0;
                    }
                    if (x === 0) { latticeCtx.moveTo(x + offsetX, y + offsetY); } else { latticeCtx.lineTo(x + offsetX, y + offsetY); }
                }
                latticeCtx.stroke();
            }
        }

        // --- Link Box Animation Functions (Only for index.html) ---
        function animateLinkBoxes() {
            if (linkBoxes.length === 0) return; // Only run if link boxes exist
            linkBoxes.forEach(box => {
                if (box.moveRange > 0) {
                    box.currentX += box.dx;
                    box.currentY += box.dy;

                    const minX = box.initialX - box.moveRange;
                    const maxX = box.initialX + box.moveRange;
                    const minY = box.initialY - box.moveRange;
                    const maxY = box.initialY + box.moveRange;

                    if (box.currentX < minX) { box.currentX = minX; box.dx = Math.abs(box.dx); }
                    else if (box.currentX > maxX) { box.currentX = maxX; box.dx = -Math.abs(box.dx); }
                    if (box.currentY < minY) { box.currentY = minY; box.dy = Math.abs(box.dy); }
                    else if (box.currentY > maxY) { box.currentY = maxY; box.dy = -Math.abs(box.dy); }
                } else {
                    box.currentX = box.initialX;
                    box.currentY = box.initialY;
                }
                box.style.left = `${box.currentX}px`;
                box.style.top = `${box.currentY}px`;
            });

            // Collision detection and resolution
            for (let i = 0; i < linkBoxes.length; i++) {
                for (let j = i + 1; j < linkBoxes.length; j++) {
                    const b1 = linkBoxes[i];
                    const b2 = linkBoxes[j];

                    // Exclude 'box-song-request' from collisions always
                    // Exclude 'audio-player-box' from collisions based on CONFIG.ENABLE_AUDIO_PLAYER_COLLISIONS
                    if ((b1.id === 'box-song-request' || b2.id === 'box-song-request') ||
                        (!CONFIG.ENABLE_AUDIO_PLAYER_COLLISIONS && (b1.id === 'audio-player-box' || b2.id === 'audio-player-box'))) {
                        continue;
                    }

                    const rect1 = { left: b1.currentX, top: b1.currentY, right: b1.currentX + b1.offsetWidth, bottom: b1.currentY + b1.offsetHeight };
                    const rect2 = { left: b2.currentX, top: b2.currentY, right: b2.currentX + b2.offsetWidth, bottom: b2.currentY + b2.offsetHeight };

                    if (rect1.left < rect2.right && rect1.right > rect2.left && rect1.top < rect2.bottom && rect1.bottom > rect2.top) {
                        // Only play sound if clankPlayers is loaded and collision sounds are enabled
                        if (areCollisionSoundsEnabled && audioContextStarted && clankPlayers && clankPlayers.loaded) {
                            const randomIndex = Math.floor(Math.random() * clankSoundFiles.length);
                            clankPlayers.player(randomIndex).start();
                        }
                        const collisionX = (Math.max(rect1.left, rect2.left) + Math.min(rect1.right, rect2.right)) / 2;
                        const collisionY = (Math.max(rect1.top, rect2.top) + Math.min(rect1.bottom, rect2.bottom)) / 2;
                        const containerScreenRect = linkBoxesContainer.getBoundingClientRect();
                        boxRipples.push(new RippleEffect(containerScreenRect.left + collisionX, containerScreenRect.top + collisionY));

                        const overlapX = Math.min(rect1.right, rect2.right) - Math.max(rect1.left, rect2.left);
                        const overlapY = Math.min(rect1.bottom, rect2.bottom) - Math.max(rect1.top, rect2.top);

                        if (overlapX < overlapY) {
                            if (rect1.left < rect2.left) { b1.currentX -= overlapX / 2 + 1; b2.currentX += overlapX / 2 + 1; } else { b1.currentX += overlapX / 2 + 1; b2.currentX -= overlapX / 2 + 1; }
                            b1.dx *= -1; b2.dx *= -1;
                        } else {
                            if (rect1.top < rect2.top) { b1.currentY -= overlapY / 2 + 1; b2.currentY += overlapY / 2 + 1; } else { b1.currentY += overlapY / 2 + 1; b2.currentY -= overlapY / 2 + 1; }
                            b1.dy *= -1; b2.dy *= -1;
                        }
                        b1.style.left = `${b1.currentX}px`; b1.style.top = `${b1.currentY}px`;
                        b2.style.left = `${b2.currentX}px`; b2.style.top = `${b2.currentY}px`;
                    }
                }
            }
        }

        function positionArrow() {

            const arrowLeftPx = songRequestBoxAbsoluteRect.left + (songRequestBoxAbsoluteRect.width / 2) - (arrowWidthPx / 2);

        // --- Main Animation Loop (Runs on all pages, but conditionally calls page-specific animations) ---
        function animate() {
            if (!rippleCtx || !latticeCtx) { // Ensure essential canvases are present
                requestAnimationFrame(animate);
                return;
            }

            rippleCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);
            for (let i = ripples.length - 1; i >= 0; i--) {
                const ripple = ripples[i];
                ripple.update();
                ripple.draw();
                if (ripple.opacity <= 0) { ripples.splice(i, 1); }
            }
            for (let i = boxRipples.length - 1; i >= 0; i--) {
                const ripple = boxRipples[i];
                ripple.update();
                ripple.draw();
                if (ripple.opacity <= 0) { boxRipples.splice(i, 1); }
            }

            if (mouseX !== lastMouseX || mouseY !== lastMouseY) { latticeNeedsRedraw = true; lastMouseX = mouseX; lastMouseY = mouseY; } // Only redraw lattice if mouse moved
            if (latticeNeedsRedraw) { drawLattice(); latticeNeedsRedraw = false; }

            // Index.html specific animations
            if (mainHeader) { // Check if mainHeader exists (implies index.html)
                if (isDiscsDrifting) {
                    cdLeftX += cdLeftDx; // Use mutable dx
                    cdLeftY += cdLeftDy; // Use mutable dy
                    cdRightX += cdRightDx; // Use mutable dx
                    cdRightY += cdRightDy; // Use mutable dy

                    // Bounce Left CD off walls
                    if (cdLeftX + cdCanvasLeft.offsetWidth > window.innerWidth) {
                        cdLeftX = window.innerWidth - cdCanvasLeft.offsetWidth; // Snap to edge
                        cdLeftDx *= -1;
                    } else if (cdLeftX < 0) {
                        cdLeftX = 0; // Snap to edge
                        cdLeftDx *= -1;
                    }
                    if (cdLeftY + cdCanvasLeft.offsetHeight > window.innerHeight) {
                        cdLeftY = window.innerHeight - cdCanvasLeft.offsetHeight; // Snap to edge
                        cdLeftDy *= -1;
                    } else if (cdLeftY < 0) {
                        cdLeftY = 0; // Snap to edge
                        cdLeftDy *= -1;
                    }

                    // Bounce Right CD off walls
                    if (cdRightX + cdCanvasRight.offsetWidth > window.innerWidth) {
                        cdRightX = window.innerWidth - cdCanvasRight.offsetWidth; // Snap to edge
                        cdRightDx *= -1;
                    } else if (cdRightX < 0) {
                        cdRightX = 0; // Snap to edge
                        cdRightDx *= -1;
                    }
                    if (cdRightY + cdCanvasRight.offsetHeight > window.innerHeight) {
                        cdRightY = window.innerHeight - cdCanvasRight.offsetHeight; // Snap to edge
                        cdRightDy *= -1;
                    } else if (cdRightY < 0) {
                        cdRightY = 0; // Snap to edge
                        cdRightDy *= -1;
                    }

                    // Update Audio Player Box position
                    audioPlayerBoxX += audioPlayerBoxDx; // Use mutable dx
                    audioPlayerBoxY += audioPlayerBoxDy; // Use mutable dy

                    // Convert viewport min/max to pixels
                    const minX_px = CONFIG.AUDIO_PLAYER_MIN_X_VW * window.innerWidth * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;
                    const maxX_px = CONFIG.AUDIO_PLAYER_MAX_X_VW * window.innerWidth * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;
                    const minY_px = CONFIG.AUDIO_PLAYER_MIN_Y_VH * window.innerHeight * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;
                    const maxY_px = CONFIG.AUDIO_PLAYER_MAX_Y_VH * window.innerHeight * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;

                    // Bounce Audio Player Box off defined boundaries
                    if (audioPlayerBoxX + audioPlayerBox.offsetWidth > maxX_px) {
                        audioPlayerBoxX = maxX_px - audioPlayerBox.offsetWidth;
                        audioPlayerBoxDx *= -1;
                    } else if (audioPlayerBoxX < minX_px) {
                        audioPlayerBoxX = minX_px;
                        audioPlayerBoxDx *= -1;
                    }
                    if (audioPlayerBoxY + audioPlayerBox.offsetHeight > maxY_px) {
                        audioPlayerBoxY = maxY_px - audioPlayerBox.offsetHeight;
                        audioPlayerBoxDy *= -1;
                    } else if (audioPlayerBoxY < minY_px) {
                        audioPlayerBoxY = minY_px;
                        audioPlayerBoxDy *= -1;
                    }
                }

                cdCanvasLeft.style.left = `${cdLeftX}px`; cdCanvasLeft.style.top = `${cdLeftY}px`;
                cdCanvasRight.style.left = `${cdRightX}px`; cdCanvasRight.style.top = `${cdRightY}px`;
                audioPlayerBox.style.left = `${audioPlayerBoxX}px`; audioPlayerBox.style.top = `${audioPlayerBoxY}px`;

                drawCD(cdCtxLeft, window.cdLeftCenterX, window.cdLeftCenterY, cdLeftRotationAngle, cdRadiusLeft, cdLabelRadiusLeft, cdHoleRadiusLeft, leftCDColors.gradientStops, leftCDColors.innerRingStrokeColor, leftCDColors.labelAreaFillColor, leftCDColors.innerLabelRingStrokeColor, leftCDColors.letterFillColor, leftCDColors.holeFillColor);
                drawCD(cdCtxRight, window.cdRightCenterX, window.cdRightCenterY, cdRightRotationAngle, cdRadiusRight, cdLabelRadiusRight, cdHoleRadiusRight, rightCDColors.gradientStops, rightCDColors.innerRingStrokeColor, rightCDColors.labelAreaFillColor, rightCDColors.innerLabelRingStrokeColor, rightCDColors.letterFillColor, rightCDColors.holeFillColor);
                animateLinkBoxes();
            }
            requestAnimationFrame(animate);
        }

        // --- Event Handlers (General or Conditional) ---
        function updateCursorPosition(e) {
            if (!customCursor) return;
            if (e.clientX >= 0 && e.clientX <= window.innerWidth && e.clientY >= 0 && e.clientY <= window.innerHeight) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
            customCursor.style.left = mouseX + 'px';
            customCursor.style.top = mouseY + 'px';
            const hue = (mouseX / window.innerWidth) * CONFIG.CURSOR_HUE_RANGE;
            const color = `hsl(${hue}, 100%, 70%)`;
            customCursor.style.borderBottomColor = color;
            customCursor.style.filter = `drop-shadow(0 0 10px ${color})`;

            // Only update CD rotation if on index.html
            if (mainHeader) {
                const normalizedX = mouseX / window.innerWidth;
                const normalizedY = mouseY / window.innerHeight;
                cdLeftRotationAngle = (normalizedX + normalizedY) * Math.PI * 2;
                cdRightRotationAngle = (normalizedX - normalizedY) * Math.PI * 2;
            }
        }

        function handleInteractiveHover(e) {
            if (!customCursor) return;
            if (e.type === 'mouseover') { customCursor.classList.add('link-hover'); }
            else if (e.type === 'mouseout') { customCursor.classList.remove('link-hover'); }
        }

        // --- Initial Setup and Resizing (Conditional) ---
        function onWindowResize() {
            resizeRippleCanvas();
            resizeLatticeCanvas();

            if (mainHeader) { // Only for index.html
                resizeCDCanvases();
                positionElements(); // Recalculate and apply positions on resize

                // Re-clamp CD and Audio Player Box positions to ensure they stay in bounds after resize
                cdLeftX = Math.max(0, Math.min(window.innerWidth - cdCanvasLeft.offsetWidth, cdLeftX));
                cdLeftY = Math.max(0, Math.min(window.innerHeight - cdCanvasLeft.offsetHeight, cdLeftY));
                cdRightX = Math.max(0, Math.min(window.innerWidth - cdCanvasRight.offsetWidth, cdRightX));
                cdRightY = Math.max(0, Math.min(window.innerHeight - cdCanvasRight.offsetHeight, cdRightY));
                
                // Re-clamp Audio Player Box positions to ensure they stay in bounds after resize
                const minX_px = CONFIG.AUDIO_PLAYER_MIN_X_VW * window.innerWidth * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;
                const maxX_px = CONFIG.AUDIO_PLAYER_MAX_X_VW * window.innerWidth * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;
                const minY_px = CONFIG.AUDIO_PLAYER_MIN_Y_VH * window.innerHeight * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;
                const maxY_px = CONFIG.AUDIO_PLAYER_MAX_Y_VH * window.innerHeight * 0.01 * CONFIG.GLOBAL_SCALE_FACTOR;

                audioPlayerBoxX = Math.max(minX_px, Math.min(maxX_px - audioPlayerBox.offsetWidth, audioPlayerBoxX));
                audioPlayerBoxY = Math.max(minY_px, Math.min(maxY_px - audioPlayerBox.offsetHeight, audioPlayerBoxY));

                cdCanvasLeft.style.left = `${cdLeftX}px`; cdCanvasLeft.style.top = `${cdLeftY}px`;
                cdCanvasRight.style.left = `${cdRightX}px`; cdCanvasRight.style.top = `${cdRightY}px`;
                audioPlayerBox.style.left = `${audioPlayerBoxX}px`; audioPlayerBox.style.top = `${audioPlayerBoxY}px`;
            }
        }

        // --- Page-specific Initialization ---
        function initIndexPage() {
            resizeCDCanvases();
            // Small delay to ensure header dimensions are computed before positioning elements
            setTimeout(() => {
                positionElements();
                animate(); // Start main animation loop for index.html
            }, 100);

            // Event listeners specific to index.html
            if (stopDiscsButton) {
                stopDiscsButton.addEventListener('click', () => {
                    isDiscsDrifting = false;
                    
                    // Apply transitions for smooth return
                    if (cdCanvasLeft) cdCanvasLeft.style.transition = 'left 1s ease-out, top 1s ease-out';
                    if (cdCanvasRight) cdCanvasRight.style.transition = 'left 1s ease-out, top 1s ease-out';
                    if (audioPlayerBox) audioPlayerBox.style.transition = 'left 1s ease-out, top 1s ease-out';
                    linkBoxes.forEach(box => {
                        box.style.transition = 'left 1s ease-out, top 1s ease-out';
                    });

                    // Reset CD positions and velocities
                    cdLeftX = initialCdLeftX;
                    cdLeftY = initialCdLeftY;
                    cdLeftDx = 0;
                    cdLeftDy = 0;

                    cdRightX = initialCdRightX;
                    cdRightY = initialCdRightY;
                    cdRightDx = 0;
                    cdRightDy = 0;

                    // Reset Audio Player Box position and velocity
                    audioPlayerBoxX = initialAudioPlayerBoxX;
                    audioPlayerBoxY = initialAudioPlayerBoxY;
                    audioPlayerBoxDx = 0;
                    audioPlayerBoxDy = 0;

                    // Reset Link Box positions and velocities
                    linkBoxes.forEach(box => {
                        box.currentX = box.initialX;
                        box.currentY = box.initialY;
                        box.dx = 0;
                        box.dy = 0;
                    });

                    // Apply reset positions to CSS
                    if (cdCanvasLeft) cdCanvasLeft.style.left = `${cdLeftX}px`;
                    if (cdCanvasLeft) cdCanvasLeft.style.top = `${cdLeftY}px`;
                    if (cdCanvasRight) cdCanvasRight.style.left = `${cdRightX}px`;
                    if (cdCanvasRight) cdCanvasRight.style.top = `${cdRightY}px`;
                    if (audioPlayerBox) audioPlayerBox.style.left = `${audioPlayerBoxX}px`;
                    if (audioPlayerBox) audioPlayerBox.style.top = `${audioPlayerBoxY}px`;
                    linkBoxes.forEach(box => {
                        box.style.left = `${box.currentX}px`;
                        box.style.top = `${box.currentY}px`;
                    });

                    stopDiscsButton.disabled = true;
                    stopDiscsButton.innerHTML = "FROZEN"; // Changed to "FROZEN"

                    // Remove transitions after they complete
                    setTimeout(() => {
                        if (cdCanvasLeft) cdCanvasLeft.style.transition = '';
                        if (cdCanvasRight) cdCanvasRight.style.transition = '';
                        if (audioPlayerBox) audioPlayerBox.style.transition = '';
                        linkBoxes.forEach(box => {
                            box.style.transition = '';
                        });
                    }, 1000); // Match transition duration
                });
            }

            if (audioToggleBtn) {
                audioToggleBtn.addEventListener('click', () => {
                    if (!audioContextStarted) { startAudioContext(); setTimeout(() => audioToggleBtn.click(), 100); return; }
                    isAudioOn = !isAudioOn;
                    if (Tone && Tone.Master) Tone.Master.mute = !isAudioOn;
                    audioToggleBtn.innerHTML = "Audio<br>" + (isAudioOn ? "ON" : "OFF");
                    audioToggleBtn.classList.toggle('muted', !isAudioOn);
                    updateCollisionSoundState(); // Update collision sound state when global audio toggles
                    
                    // Control background music based on global audio state
                    if (backgroundPlayer && backgroundPlayer.loaded) {
                        if (isAudioOn && !isPlayerPlaying) {
                            backgroundPlayer.start();
                        } else {
                            backgroundPlayer.stop();
                        }
                    }
                });
            }

            if (audioPlayPauseBtn) {
                audioPlayPauseBtn.addEventListener('click', () => {
                    if (!audioContextStarted) { startAudioContext(); setTimeout(() => audioPlayPauseBtn.click(), 100); return; }
                    // Only play if audioPlayer is loaded
                    if (audioPlayer && audioPlayer.loaded) {
                        if (isPlayerPlaying) {
                            audioPlayer.stop();
                        } else {
                            audioPlayer.start();
                            if (backgroundPlayer && backgroundPlayer.loaded) {
                                backgroundPlayer.stop(); // Stop background music when main player starts
                            }
                        }
                        isPlayerPlaying = !isPlayerPlaying;
                        updateAudioPlayerButtonIcon(); // Update icon based on new state
                        updateCollisionSoundState(); // Update collision sound state when player state changes
                    } else { console.warn("Audio player not loaded or initialized yet."); }
                });
            }

            // Attach a one-time click listener to the body to start the audio context
            document.body.addEventListener('click', startAudioContext, { once: true });
        }

        // --- Main window.onload ---
        window.onload = () => {
            // Always resize and draw lattice for all pages
            resizeLatticeCanvas();
            resizeRippleCanvas(); // Ensure ripple canvas is also sized

            // Setup custom cursor for all pages
            document.addEventListener('mousemove', updateCursorPosition);
            document.addEventListener('click', emitRipple); // Ripples on click for all pages

            // Setup interactive hover for all pages (if any elements exist)
            document.querySelectorAll('[data-interactive-element]').forEach(element => {
                element.addEventListener('mouseover', handleInteractiveHover);
                element.addEventListener('mouseout', handleInteractiveHover);
            });

            // Page-specific initializations
            if (mainHeader) { // Check for a unique element on index.html
                initIndexPage();
            } else { // For other pages (contact.html, song_request.html)
                animate(); // Start animation loop for background lattice and cursor
            }

            window.addEventListener('resize', onWindowResize); // Global resize listener
        };
    </script>
</body>
</html>
